[project]
name = "ibis-anim"
version = "0.1.0"
description = "Drop-in ibis replacement: a visual debugger for ibis data transformations, rendered with manim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ibis-framework[duckdb]>=10",
    "manim>=0.19",
    "portion>=2.4",
    "pyyaml>=6",
    # _derive.py uses sqlglot itself. From 30.18, sqlglot.Drop has no `this`: ibis 12 then writes a DROP without
    # a table name, and Table.cache(), create_table(overwrite=True) and the memtable cleanup at exit fail.
    "sqlglot>=28,<30.18",
]

[project.optional-dependencies]
dbt = ["dbt-ibis>=0.11"]  # for projects with dbt-ibis models

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ibis_anim"]
